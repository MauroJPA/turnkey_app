# gc_turnkey — servidor (PocketBase + app web). Uso:  bash gc_turnkey.sh instalar
#
# Tudo o que interessa fica em ./data (base de dados + ficheiros) e ./.env
# (segredos): para mudar de maquina (ou para a nuvem) basta levar estas duas coisas.
name: gc_turnkey

services:
  gc_turnkey:
    build:
      context: .
      args:
        PB_VERSION: ${PB_VERSION:-0.40.4}
    image: gc_turnkey:${GC_TURNKEY_VERSAO:-local}
    container_name: gc_turnkey
    restart: unless-stopped
    # o utilizador dono de ./data (o gc_turnkey.sh preenche estes valores)
    user: "${GC_TURNKEY_UID:-1000}:${GC_TURNKEY_GID:-1000}"
    # so acessivel neste servidor; o Tailscale (ou um proxy) da o HTTPS.
    # Porta 8091 (nao 8090) para nao chocar com outro PocketBase no mesmo PC.
    ports:
      - "127.0.0.1:${GC_TURNKEY_PORTA:-8091}:8090"
    env_file: .env
    environment:
      GC_TURNKEY_DEV: "0"
      TZ: Europe/Lisbon
    volumes:
      - ./data:/pb/pb_data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
