<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="gc_turnkey — ERP para gestão de custos, produção e fichas técnicas">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="gc_turnkey">
  <meta name="theme-color" content="#192621">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>gc_turnkey</title>
  <link rel="manifest" href="manifest.json">
  <style>
    #gc-splash { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #FFFBF0; color: #192621; font-family: Arial, Helvetica, sans-serif; }
    @media (prefers-color-scheme: dark) { #gc-splash { background: #192621; color: #FFFBF0; } }
    #gc-splash img { width: 88px; height: 88px; border-radius: 20px; }
    #gc-splash .t { font-size: 15px; opacity: .85; }
    #gc-splash .aviso { display: none; max-width: 300px; text-align: center; font-size: 14px; line-height: 1.45; }
    #gc-splash button { margin-top: 10px; font-size: 15px; padding: 10px 22px; border-radius: 22px; border: 0; background: #B58054; color: #fff; }
  </style>
</head>
<body>
  <!-- ecrã de arranque: nunca fica um branco vazio (some quando a app desenha o 1.º ecrã) -->
  <div id="gc-splash">
    <img src="icons/Icon-192.png" alt="">
    <div class="t" id="gc-splash-t">A carregar…</div>
    <div class="aviso" id="gc-splash-aviso">
      Está a demorar mais do que o normal. Confirma que o Wi-Fi ou o Tailscale está ligado neste telemóvel.
      <br><button onclick="gcRecarregar()">Tentar de novo</button>
    </div>
  </div>
  <script>
    window.gcRecarregar = async function () {
      try {
        var regs = await navigator.serviceWorker.getRegistrations();
        for (var r of regs) await r.unregister();
        for (var k of await caches.keys()) await caches.delete(k);
      } catch (_) {}
      location.reload();
    };
    window.addEventListener('flutter-first-frame', function () {
      var e = document.getElementById('gc-splash');
      if (e) e.remove();
    });
    setTimeout(function () {
      var a = document.getElementById('gc-splash-aviso');
      var t = document.getElementById('gc-splash-t');
      if (a && document.getElementById('gc-splash')) { a.style.display = 'block'; if (t) t.style.display = 'none'; }
    }, 8000);
  </script>
  <script src="gc_dispositivo.js"></script>
  <script src="gc_instalar.js"></script>
  <script src="gc_pdf.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
